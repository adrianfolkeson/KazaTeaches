<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f2f2">
<title>KazaTeaches</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="kt-app">

  <!-- ── Idag ────────────────────────────────────────────────────────── -->
  <section class="kt-screen" id="s-today" data-on>
    <div style="padding: 0 var(--space-4) var(--space-8); display:flex; flex-direction:column; flex:1;">
      <h1 style="font-size:40px; line-height:1.05; margin:var(--space-4) 0 var(--space-2);">Idag</h1>
      <p id="today-line" style="margin:0 0 var(--space-6); font-size:17px; max-width:30ch;
         color:color-mix(in srgb, var(--color-text) 72%, transparent);">Läser in…</p>

      <div style="display:flex; align-items:flex-end; gap:var(--space-6); margin-bottom:var(--space-3);">
        <div style="display:flex; flex-direction:column;">
          <span class="kt-num" id="due-count" style="font-family:var(--font-heading); font-size:64px; line-height:.9; letter-spacing:-.03em;">–</span>
          <span class="kt-eyebrow" style="margin-top:var(--space-2);">förfallna frågor</span>
        </div>
        <div style="display:flex; flex-direction:column;">
          <span class="kt-num" id="concept-count" style="font-family:var(--font-heading); font-size:64px; line-height:.9; letter-spacing:-.03em; color:var(--color-accent-700);">–</span>
          <span class="kt-eyebrow" style="margin-top:var(--space-2);">begrepp</span>
        </div>
      </div>

      <div class="kt-ticks" id="today-ticks" style="height:22px; margin-bottom:var(--space-1);"></div>
      <div class="kt-eyebrow" id="pass-line" style="margin-bottom:var(--space-8);"></div>

      <h2 class="kt-h2" style="margin-top:0;">Svagast just nu</h2>
      <div id="weak" style="display:flex; flex-direction:column; gap:var(--space-4); margin-bottom:var(--space-8);"></div>

      <button class="kt-btn" id="start">Starta passet</button>
      <div id="cap-line" style="font-size:12px; text-align:center; margin-top:var(--space-2);
           color:color-mix(in srgb, var(--color-text) 50%, transparent);"></div>

      <div id="budget" style="margin-top:auto; padding-top:var(--space-8); display:flex; flex-direction:column; gap:var(--space-1);" hidden>
        <div style="height:2px; background:color-mix(in srgb, var(--color-text) 10%, transparent);">
          <div id="budget-bar" style="height:2px; width:0; background:var(--color-accent);"></div>
        </div>
        <div class="kt-num" id="budget-line" style="font-size:11px; letter-spacing:.04em;
             color:color-mix(in srgb, var(--color-text) 50%, transparent);"></div>
      </div>
    </div>
  </section>

  <!-- ── Session ─────────────────────────────────────────────────────── -->
  <section class="kt-screen" id="s-session">
    <div style="padding:0 var(--space-4);">
      <div class="kt-ticks" id="session-ticks" style="height:10px; gap:2px;"></div>
      <div style="display:flex; align-items:baseline; gap:var(--space-3); margin-top:var(--space-2);" class="kt-eyebrow">
        <span id="q-concept" style="color:var(--color-accent-700);"></span>
        <span class="kt-num" id="attempt-line" style="margin-left:auto;"></span>
        <button class="kt-link" id="pause" style="font-size:11px; letter-spacing:.09em; text-transform:uppercase;">Pausa</button>
      </div>
    </div>

    <div style="padding:var(--space-6) var(--space-4) 0;">
      <h1 id="q-prompt" style="font-size:27px; line-height:1.22; letter-spacing:-.01em; margin:0 0 var(--space-4); text-wrap:pretty;"></h1>
      <div id="q-code"></div>
      <textarea id="answer" class="kt-answer" spellcheck="false" autocomplete="off"
                autocorrect="off" autocapitalize="off"
                placeholder="Skriv ditt svar. Ingen ledtråd förrän du lämnat in."></textarea>
      <div class="kt-eyebrow" id="word-line" style="margin-top:var(--space-1); letter-spacing:.06em;"></div>
    </div>

    <div class="kt-sticky">
      <div style="display:flex; align-items:baseline; gap:var(--space-2); margin-bottom:var(--space-2);">
        <span style="font-family:var(--font-heading); font-size:19px;">Hur säker är du?</span>
        <span class="kt-eyebrow" id="conf-hint" style="margin-left:auto; letter-spacing:.08em;"></span>
      </div>
      <div class="kt-conf" id="conf" style="margin-bottom:var(--space-3);"></div>
      <button class="kt-btn" id="submit" disabled>Välj hur säker du är</button>
    </div>
  </section>

  <!-- ── Bedömning ───────────────────────────────────────────────────── -->
  <section class="kt-screen" id="s-graded">
    <div style="display:flex; flex-direction:column; flex:1; padding:0 var(--space-4) var(--space-8);">
      <div class="kt-verdict" id="verdict" style="animation:ktInk 320ms ease-out;">
        <div class="v"></div><div class="sub"></div>
      </div>

      <h2 class="kt-h2">Vad du hade</h2>
      <ul class="kt-rubric" id="r-hits" style="padding:0; margin:0;"></ul>
      <div id="no-hits" style="font-size:16px; font-style:italic;
           color:color-mix(in srgb, var(--color-text) 55%, transparent);" hidden>Ingenting den här gången.</div>

      <h2 class="kt-h2" id="h-partials" style="margin-top:var(--space-6);" hidden>Bara halvvägs</h2>
      <ul class="kt-rubric" id="r-partials" style="padding:0; margin:0;"></ul>

      <h2 class="kt-h2" id="h-misses" style="margin-top:var(--space-6); color:var(--color-accent-2);" hidden>Vad du missade</h2>
      <ul class="kt-rubric" id="r-misses" style="padding:0; margin:0;"></ul>

      <div class="kt-stats">
        <div><span class="val" id="st-score"></span><span class="cap">score</span></div>
        <div><span class="val" id="st-conf"></span><span class="cap">du sa</span></div>
        <div class="gap"><span class="val" id="st-gap"></span><span class="cap">gap</span></div>
      </div>

      <div class="kt-feedback" id="g-feedback"></div>

      <div style="margin-top:var(--space-8);">
        <div class="kt-eyebrow" style="margin-bottom:var(--space-2);">Följdfråga</div>
        <div id="g-followup" style="font-family:var(--font-heading); font-size:22px; line-height:1.25;
             text-wrap:pretty; margin-bottom:var(--space-4);"></div>
        <button class="kt-btn" id="next">Nästa fråga</button>
        <div style="display:flex; align-items:center; gap:var(--space-4); margin-top:var(--space-3);">
          <button class="kt-btn kt-btn-ghost" id="to-today">Avsluta passet</button>
          <button class="kt-link" id="show-facit">Visa facit</button>
        </div>
      </div>

      <div id="facit" style="margin-top:var(--space-4); padding:var(--space-3);
           background:var(--color-neutral-200); border-radius:var(--radius-md);
           font-size:16px; line-height:1.55;" hidden></div>

      <div id="sched-line" class="kt-eyebrow" style="margin-top:var(--space-4);"></div>

      <details style="margin-top:var(--space-6);">
        <summary class="kt-eyebrow" style="cursor:pointer;">Ditt svar</summary>
        <div id="your-answer" style="margin-top:var(--space-2); font-size:15px; line-height:1.55;
             white-space:pre-wrap; color:color-mix(in srgb, var(--color-text) 70%, transparent);"></div>
      </details>
    </div>
  </section>

  <div id="err" style="display:none; margin:var(--space-4); padding:var(--space-3);
       border-left:2px solid var(--color-accent-2); font-size:14px;"></div>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
